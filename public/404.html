<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Faafu Atoll School Attendance</title>
    <script>
      // Redirect all deep links back to index.html so the SPA can handle them.
      // Converts the path to a hash so the app router picks it up.
      var pathSegmentsToKeep = 1; // /Attendance-Management-/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
